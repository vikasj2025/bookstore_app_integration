version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: build-env-postgres
    environment:
      POSTGRES_DB: build_environment
      POSTGRES_USER: build_env_user
      POSTGRES_PASSWORD: build_env_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - build-env-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U build_env_user -d build_environment"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: build-env-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - build-env-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: build-env-app
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: build_environment
      DB_USERNAME: build_env_user
      DB_PASSWORD: build_env_password
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Application Configuration
      SERVER_PORT: 8080
      LOG_LEVEL: INFO
      
      # JWT Configuration
      JWT_SECRET: mySecretKey123456789012345678901234567890
      JWT_EXPIRATION: 86400000
      
      # Encryption Configuration
      ENCRYPTION_SECRET_KEY: myEncryptionKey1234567890123456
      
      # Build Tools Configuration
      BUILD_TOOL_INSTALLATION_PATH: /opt/build-tools
      MAX_CONCURRENT_DOWNLOADS: 5
      
      # Health Check Configuration
      HEALTH_CHECK_INTERVAL: 24
      HEALTH_CHECK_TIMEOUT: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - build-env-network
    volumes:
      - app_logs:/app/logs
      - build_tools:/opt/build-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: build-env-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - build-env-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: build-env-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - build-env-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  build_tools:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  build-env-network:
    driver: bridge