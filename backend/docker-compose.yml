version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: maven-bootstrap-postgres
    environment:
      POSTGRES_DB: maven_bootstrap
      POSTGRES_USER: maven_bootstrap
      POSTGRES_PASSWORD: maven_bootstrap
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - maven-bootstrap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maven_bootstrap -d maven_bootstrap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: maven-bootstrap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - maven-bootstrap-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Maven Bootstrap API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maven-bootstrap-api
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: docker
      
      # Database Configuration
      DB_URL: jdbc:postgresql://postgres:5432/maven_bootstrap
      DB_USERNAME: maven_bootstrap
      DB_PASSWORD: maven_bootstrap
      DB_POOL_SIZE: 20
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      
      # JWT Configuration
      JWT_SECRET: docker-development-secret-key-change-in-production-256-bits
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000
      
      # Server Configuration
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: /v1
      
      # Maven Configuration
      MAVEN_DEFAULT_DOWNLOAD_URL: https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven
      MAVEN_WRAPPER_VERSION: 3.9.5
      MAVEN_DOWNLOAD_TIMEOUT: 300000
      
      # Download Configuration
      DOWNLOAD_BASE_PATH: /app/downloads
      
      # Logging Configuration
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/maven-bootstrap-api.log
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      
      # Actuator Configuration
      ACTUATOR_HEALTH_SHOW_DETAILS: always
      
      # JVM Options
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
    volumes:
      - api_logs:/app/logs
      - api_downloads:/app/downloads
    networks:
      - maven-bootstrap-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Prometheus (Optional - for metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: maven-bootstrap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - maven-bootstrap-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana (Optional - for metrics visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: maven-bootstrap-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - maven-bootstrap-network
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  api_downloads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  maven-bootstrap-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16