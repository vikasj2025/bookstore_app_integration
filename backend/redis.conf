# Redis configuration for Maven Bootstrap API

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Snapshotting
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Replication
# slaveof <masterip> <masterport>
# masterauth <master-password>
# slave-serve-stale-data yes
# slave-read-only yes

# Security
# requirepass foobared
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command EVAL ""
# rename-command DEBUG ""
# rename-command CONFIG ""

# Limits
maxclients 10000
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Append only file
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Lua scripting
lua-time-limit 5000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitor
latency-monitor-threshold 100

# Event notification
notify-keyspace-events ""

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
aof-rewrite-incremental-fsync yes

# TLS/SSL (disabled for development)
# port 0
# tls-port 6379
# tls-cert-file redis.crt
# tls-key-file redis.key
# tls-ca-cert-file ca.crt

# Modules
# loadmodule /path/to/my_module.so

# Custom settings for Maven Bootstrap API
# Optimize for caching use case
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Memory optimization
maxmemory-policy volatile-lru

# Keyspace notifications for cache events
notify-keyspace-events Ex

# Disable some commands for security
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command SHUTDOWN MAVEN_SHUTDOWN_b840fc02d524045429941cc15f59e41cb7be6c52

# Client timeout
timeout 300

# Enable lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
slave-lazy-flush yes

# Jemalloc background thread
jemalloc-bg-thread yes

# IO threads (Redis 6.0+)
# io-threads 4
# io-threads-do-reads yes