version: '3.8'

services:
  # Development service
  bookstore-ui-dev:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
    networks:
      - bookstore-network
    profiles:
      - dev

  # Production service
  bookstore-ui-prod:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL:-http://localhost:8080/api/v1}
    networks:
      - bookstore-network
    profiles:
      - prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - bookstore-ui-prod
    networks:
      - bookstore-network
    profiles:
      - prod
    restart: unless-stopped

networks:
  bookstore-network:
    driver: bridge
    external: true

volumes:
  node_modules:
  next_cache:
