version: '3.8'

services:
  # Frontend Application
  bookstore-ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_APP_ENV=production
      - NEXT_PUBLIC_ENABLE_MSW=false
    volumes:
      # Mount for development (comment out for production)
      # - .:/app
      # - /app/node_modules
      # - /app/.next
    restart: unless-stopped
    networks:
      - bookstore-network
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development Server (alternative to production build)
  bookstore-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_APP_ENV=development
      - NEXT_PUBLIC_ENABLE_MSW=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - bookstore-network
    profiles:
      - dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - bookstore-network
    depends_on:
      - bookstore-ui

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bookstore-network
    command: redis-server --appendonly yes
    profiles:
      - cache

volumes:
  redis_data:
    driver: local

networks:
  bookstore-network:
    driver: bridge
