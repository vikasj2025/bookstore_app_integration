# Test Configuration
spring:
  application:
    name: automated-build-environment-test
  
  # Use H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  # JPA Configuration for tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    defer-datasource-initialization: true
  
  # Disable Flyway for tests
  flyway:
    enabled: false
  
  # Use embedded Redis for tests
  data:
    redis:
      host: localhost
      port: 6370  # Different port to avoid conflicts
      timeout: 2000ms
  
  # Cache Configuration
  cache:
    type: simple  # Use simple cache for tests
  
  # SQL initialization
  sql:
    init:
      mode: always
      data-locations: classpath:test-data.sql

# Logging Configuration for tests
logging:
  level:
    com.buildenvironment: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Test-specific configuration
app:
  jwt:
    secret: testSecretKey123456789012345678901234567890
    expiration: 3600000  # 1 hour for tests
  
  encryption:
    secret-key: testEncryptionKey1234567890123456
  
  build-tools:
    download-timeout: 10000  # 10 seconds for tests
    installation-path: /tmp/test-build-tools
    max-concurrent-downloads: 2
  
  health-check:
    interval-hours: 1  # More frequent for tests
    timeout-seconds: 5
  
  repository:
    validation-timeout: 5000  # 5 seconds for tests
    retry-attempts: 1

# Disable security for tests
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always